<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Module 06 local HTTP server</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f7f9;
        color: #16181d;
      }

      main {
        max-width: 760px;
        margin: 8vh auto;
        padding: 32px;
        background: #fff;
        border: 1px solid #d9dde5;
        border-radius: 8px;
      }

      code {
        background: #eef1f6;
        border-radius: 4px;
        padding: 2px 5px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Module 06 local HTTP server</h1>
      <p>This page is served directly by Nginx as a static HTTP server.</p>
      <p>The endpoint <code>/api/status</code> is proxied by Nginx to the backend service.</p>
      <p id="asset-status">Asset script has not run yet.</p>
    </main>
    <script src="/assets/app.js"></script>
  </body>
</html>
